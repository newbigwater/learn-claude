<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <meta name="description" content="카테고리, 태그, 우선순위, 마감일로 할 일을 관리하는 Todo 앱" />
    <script>
      // 렌더링 전에 다크모드를 적용해 깜빡임 방지
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- 빌드 없이 실행: 브라우저가 import map으로 CDN의 React/htm을 직접 불러온다. (모듈 스크립트보다 먼저 선언) -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>

    <!-- Tailwind v4 브라우저 빌드: 화면에 나타나는 클래스를 런타임에 읽어 스타일을 만든다. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      /* 클래스 기반 다크모드 (html.dark) */
      @custom-variant dark (&:where(.dark, .dark *));

      @theme {
        --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }

      @layer base {
        body {
          @apply bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100;
        }

        /* 키보드 포커스 표시 */
        :focus-visible {
          @apply outline-2 outline-offset-2 outline-indigo-500;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
